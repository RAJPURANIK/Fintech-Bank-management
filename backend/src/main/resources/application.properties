server.port=8080

# Database Configuration (Environment variable overrides with fallbacks)
# Default to file-based persistent H2 in user directory when external MySQL credentials are not provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bankdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bankpass}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=fintech-bank-management

# Logging
logging.level.com.fintech.bank=INFO
logging.level.org.springframework.web=INFO
